<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>tarea 10</title>
    <style>
        #contenedor {
            display: grid;
            grid-template-areas:
                "uno dos   dos   tres"
                "uno cinco siete cuatro"
                "uno ocho  seis  cuatro";
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
            width: 420px;
            height: 230px;
            padding: 5px;
            border: 1px solid gray;
        }

        .caja {
            width: 100%;
            height: 100%;
            border: 1px solid black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        .uno {
            grid-area: uno;
            background: linear-gradient(to right, green, lightgreen);
        }

        .dos {
            grid-area: dos;
            background: linear-gradient(to bottom, green, lightgreen);
        }

        .tres {
            grid-area: tres;
            background: linear-gradient(35deg, red, white);
        }

        .cuatro {
            grid-area: cuatro;
            background: linear-gradient(to right, green, lightgreen, white);
        }

        .cinco {
            grid-area: cinco;
            background: linear-gradient(to right, orange 20%, yellow 70%, white 100%);
        }

        .seis {
            grid-area: seis;
            background: linear-gradient(to bottom, orange, yellow);
        }

        .siete {
            grid-area: siete;
            background: linear-gradient(35deg, red, orange);
        }

        .ocho {
            grid-area: ocho;
            background: linear-gradient(to right, red 20%, orange 50%, yellow 70%, white 100%);
        }
    </style>
</head>
<body>
    <h1>grid 1</h1>
    <div id="contenedor">
        <div class="caja uno">UNO</div>
        <div class="caja dos">DOS</div>
        <div class="caja tres">TRES</div>
        <div class="caja cuatro">CUATRO</div>
        <div class="caja cinco">CINCO</div>
        <div class="caja seis">SEIS</div>
        <div class="caja siete">SIETE</div>
        <div class="caja ocho">OCHO</div>
    </div>
</body>
</html>
